<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MobileCRM.Platform test</title>
  <script src="JSBridge.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 20px;
    }

    button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 4px;
      background: #0067b8;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-left: 4px solid #777;
      background: color-mix(in srgb, CanvasText 6%, Canvas);
    }

    #status.success {
      border-color: #16803a;
    }

    #status.error {
      border-color: #c42b1c;
    }

    pre {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>MobileCRM.Platform test</h1>
    <p>Press the button to call <code>MobileCRM.Platform.requestObject</code>.</p>
    <button id="run" type="button">Run platform test</button>
    <div id="status" role="status">Ready.</div>
    <pre id="result" aria-live="polite"></pre>
  </main>

  <script>
    (function () {
      var button = document.getElementById("run");
      var status = document.getElementById("status");
      var result = document.getElementById("result");

      function finish(message, className, details) {
        button.disabled = false;
        status.className = className;
        status.textContent = message;
        result.textContent = details || "";
      }

      button.addEventListener("click", function () {
        button.disabled = true;
        status.className = "";
        status.textContent = "Calling MobileCRM.Platform.requestObject...";
        result.textContent = "";

        if (!window.MobileCRM || !MobileCRM.Platform || typeof MobileCRM.Platform.requestObject !== "function") {
          finish("Failed: MobileCRM.Platform.requestObject is unavailable.", "error");
          return;
        }

        MobileCRM.Platform.requestObject(
          function (platform) {
            var details = {};
            Object.keys(platform || {}).sort().forEach(function (key) {
              var value = platform[key];
              if (typeof value !== "function") {
                details[key] = value;
              }
            });
            finish("Success: MobileCRM.Platform returned a platform object.", "success", JSON.stringify(details, null, 2));
          },
          function (error) {
            finish("Platform call failed.", "error", String(error || "Unknown error"));
          }
        );
      });
    }());
  </script>
</body>
</html>
