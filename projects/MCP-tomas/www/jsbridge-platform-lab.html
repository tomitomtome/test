<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSBridge Platform Test Lab</title>
  <script src="JSBridge.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; --accent:#0067b8; --ok:#16803a; --error:#c42b1c; --line:color-mix(in srgb,CanvasText 18%,Canvas); --surface:color-mix(in srgb,CanvasText 5%,Canvas); }
    * { box-sizing:border-box; } body { margin:0; background:Canvas; color:CanvasText; } header { padding:24px; background:var(--surface); border-bottom:1px solid var(--line); } h1 { margin:0 0 8px; font-size:26px; } header p { margin:0; opacity:.8; } main { max-width:980px; margin:auto; padding:20px 24px 40px; } h2 { margin:26px 0 8px; font-size:18px; } article { display:grid; grid-template-columns:190px 1fr 160px; gap:12px 20px; padding:16px 0; border-bottom:1px solid var(--line); } .method { font-family:Consolas,monospace; font-weight:700; overflow-wrap:anywhere; } p { margin:0; line-height:1.45; } .notice { display:block; margin-top:6px; color:#9a6700; font-size:12px; font-weight:700; } button { min-height:42px; border:0; border-radius:4px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; } button:disabled { opacity:.6; cursor:wait; } pre { grid-column:1/-1; display:none; max-height:240px; margin:0; padding:12px; overflow:auto; border-left:4px solid #777; background:var(--surface); white-space:pre-wrap; overflow-wrap:anywhere; } pre.visible { display:block; } pre.success { border-color:var(--ok); } pre.error { border-color:var(--error); } @media(max-width:680px) { header,main { padding-left:16px; padding-right:16px; } article { grid-template-columns:1fr; } button { min-height:44px; } pre { grid-column:1; } }
  </style>
</head>
<body>
  <header><h1>JSBridge Platform Test Lab</h1><p>Každé tlačidlo zavolá jednu metódu <code>MobileCRM.Platform</code> a zobrazí jej výsledok alebo chybu.</p></header>
  <main id="lab"></main>
  <script>
    (function () {
      var groups = [
        ["Informácie", [["requestObject","Platforma a verzia aplikácie."],["getDeviceInfo","Dostupné informácie o zariadení."],["getNetworkInfo","Stav siete a pripojenia."],["getURL","URL mobilnej aplikácie."]]],
        ["Poloha", [["getLocation","Jednorazová GPS poloha.","maximumAge 0 ms, presnosť 100 m, timeout 15 s"],["getLocationAsync","Promise GPS poloha.","maximumAge 0 ms, presnosť 100 m, timeout 15 s"],["watchLocationUpdates","Priebežné GPS aktualizácie.","Používa GPS priebežne"],["navigateTo","Navigácia na testovacie súradnice Bratislavy.","Otvorí mapovú aplikáciu"]]],
        ["Skenovanie a UI", [["scanBarCode","Natívny QR alebo čiarový skener.","Vyžaduje kameru"],["scanBarCodeRequiredLength","Skener pre presne 8 znakov.","Vyžaduje kameru"],["showAlert","Natívny dialóg."],["showToast","Krátka natívna notifikácia."]]],
        ["Externé akcie", [["openUrl","Otvorí testovaciu HTTPS stránku.","Otvorí prehliadač"],["openDocument","Spustí Windows Notepad priamo.","Funguje vo Windows klientovi"],["makeCall","Otvorí dialer s testovacím číslom.","Hovor nepotvrdzuj"],["sendSMS","Otvorí SMS editor s testovacím číslom.","Správu neposielaj"],["email","Otvorí e-mailový editor.","E-mail neposielaj"],["sendEmail","E-mail cez MIME typ.","E-mail neposielaj"],["emailWithAttachments","E-mail s prázdnymi prílohami.","Môže otvoriť e-mailový editor"]]],
        ["Navigačné správanie", [["preventBackButton","Zachytí natívne tlačidlo Späť.","Zmení Späť v tomto iframe"]]]
      ];
      function esc(value) { return String(value).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
      var html=""; groups.forEach(function(group){ html+="<h2>"+esc(group[0])+"</h2>"; group[1].forEach(function(test){ html+="<article data-test=\""+test[0]+"\"><div class=\"method\">"+test[0]+"()</div><p>"+esc(test[1])+(test[2]?"<span class=\"notice\">"+esc(test[2])+"</span>":"")+"</p><button type=\"button\">Spustiť test</button><pre></pre></article>"; }); }); document.getElementById("lab").innerHTML=html;
      function text(value) { if(value===undefined)return "Metóda nevrátila hodnotu."; if(value===null)return "null"; if(typeof value==="string")return value; try{return JSON.stringify(value,null,2);}catch(e){return String(value);} }
      function out(name,state,value) { var item=document.querySelector('[data-test="'+name+'"]'), result=item.querySelector("pre"); result.className="visible "+state; result.textContent=text(value); item.querySelector("button").disabled=state==="pending"; }
      function ok(name){return function(value){out(name,"success",value);};} function fail(name){return function(error){out(name,"error",error||"Neznáma chyba");};}
      var tests = {
        requestObject:function(){MobileCRM.Platform.requestObject(ok("requestObject"),fail("requestObject"));}, getDeviceInfo:function(){MobileCRM.Platform.getDeviceInfo(ok("getDeviceInfo"),fail("getDeviceInfo"));}, getNetworkInfo:function(){MobileCRM.Platform.getNetworkInfo(ok("getNetworkInfo"),fail("getNetworkInfo"));}, getURL:function(){MobileCRM.Platform.getURL(ok("getURL"),fail("getURL"));},
        getLocation:function(){MobileCRM.Platform.getLocation(ok("getLocation"),fail("getLocation"),0,100,15000);}, getLocationAsync:function(){var p=MobileCRM.Platform.getLocationAsync(0,100,15000); if(!p||!p.then)out("getLocationAsync","error","Metóda nevrátila Promise."); else p.then(ok("getLocationAsync"),fail("getLocationAsync"));}, watchLocationUpdates:function(){MobileCRM.Platform.watchLocationUpdates(ok("watchLocationUpdates"),true);out("watchLocationUpdates","success","Handler bol zaregistrovaný.");}, navigateTo:function(){MobileCRM.Platform.navigateTo(48.1486,17.1077,fail("navigateTo"));out("navigateTo","success","Požiadavka bola odoslaná.");},
        scanBarCode:function(){MobileCRM.Platform.scanBarCode(ok("scanBarCode"),fail("scanBarCode"));}, scanBarCodeRequiredLength:function(){MobileCRM.Platform.scanBarCodeRequiredLength(8,ok("scanBarCodeRequiredLength"),fail("scanBarCodeRequiredLength"));}, showAlert:function(){MobileCRM.Platform.showAlert("JSBridge showAlert funguje.",false,"OK",["OK"]);out("showAlert","success","Dialóg bol vyžiadaný.");}, showToast:function(){MobileCRM.Platform.showToast("JSBridge showToast funguje.");out("showToast","success","Toast bol vyžiadaný.");},
        openUrl:function(){MobileCRM.Platform.openUrl("https://www.resco.net/");out("openUrl","success","URL bola odoslaná.");}, openDocument:function(){MobileCRM.Platform.openDocument("notepad.exe",null,null,fail("openDocument"));out("openDocument","success","Požiadavka na spustenie notepad.exe bola odoslaná.");}, makeCall:function(){MobileCRM.Platform.makeCall("+421000000000",fail("makeCall"));out("makeCall","success","Dialer bol vyžiadaný.");}, sendSMS:function(){MobileCRM.Platform.sendSMS("+421000000000","JSBridge Platform test",fail("sendSMS"));out("sendSMS","success","SMS editor bol vyžiadaný.");}, email:function(){MobileCRM.Platform.email("jsbridge-test@example.invalid","JSBridge test","Test",fail("email"));out("email","success","E-mailový editor bol vyžiadaný.");}, sendEmail:function(){MobileCRM.Platform.sendEmail("jsbridge-test@example.invalid","JSBridge test","Test","text/plain",fail("sendEmail"));out("sendEmail","success","E-mailový editor bol vyžiadaný.");}, emailWithAttachments:function(){MobileCRM.Platform.emailWithAttachments("jsbridge-test@example.invalid","JSBridge test","Test",[],null,null,fail("emailWithAttachments"));out("emailWithAttachments","success","E-mailový editor bol vyžiadaný.");}, preventBackButton:function(){MobileCRM.Platform.preventBackButton(function(){out("preventBackButton","success","Tlačidlo Späť bolo zachytené.");return true;});out("preventBackButton","success","Handler je aktívny.");}
      };
      Array.prototype.forEach.call(document.querySelectorAll("article"),function(item){var name=item.getAttribute("data-test");item.querySelector("button").addEventListener("click",function(){if(!window.MobileCRM||!MobileCRM.Platform||typeof MobileCRM.Platform[name]!=="function"){out(name,"error","Metóda nie je dostupná.");return;}out(name,"pending","Volám MobileCRM.Platform."+name+"...");try{tests[name]();}catch(error){fail(name)(error.message||error);}});});
    }());
  </script>
</body>
</html>
